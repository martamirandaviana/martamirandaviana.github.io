intro: My research explores collective ownership, cooperative housing and the conditions for lasting housing affordability in Portugal.
page_intro:
affiliation: Architect and PhD researcher at FAUP, with international academic experience at KTH, published research, professional and teaching experience, and a strong interest in cooperative housing and housing policy.
membership: Member of Rede-H
context: Developed at FAUP and the Nuno Portas Centre for Studies, this work connects architectural research with housing policy, public land and the ways communities produce and inhabit space.
orcid: https://orcid.org/0000-0002-9994-7610
years: [2026, 2022, 2021]
publications:
  - id: cooperative-housing
    year: 2026
    kind: Conference contribution
    title: Collective Ownership and Cooperative Housing under Rights of Use. Non-Speculative Approaches to Affordable Housing in Portugal
    authors: Marta Maçães Viana · Gisela Lameira
    venue: "EURAU 2026 · LATITUDES. Situated reflections on architectural research"
    detail: Extended abstract · Umeå University · June 2026 · pp. 570–576
    language: English
    theme: housing
    summary: Examines cooperative housing under rights of use in Portugal alongside European precedents, focusing on public or collective land control, limits on profit, and regulation that can sustain long-term affordability.
    citation: "Viana, Marta Maçães; Lameira, Gisela. “Collective Ownership and Cooperative Housing under Rights of Use. Non-Speculative Approaches to Affordable Housing in Portugal.” In LATITUDES. Situated reflections on architectural research. Umeå University, June 2026, pp. 570–576. ISBN 978-91-6850-075-1."
    pdf: /assets/research/papers/eurau-2026-cooperative-housing.pdf
    image: /assets/research/ownership-map.png
    image_alt: "Marta Maçães Viana’s research framework mapping collective ownership and cooperative housing under rights of use across Europe."
  - id: publico-cooperatives
    year: 2026
    kind: Opinion article
    title: "IVA a 6% para todos: e as cooperativas, onde ficam?"
    title_lang: pt
    authors: Marta Maçães Viana
    venue: PUBLICO · Opinião
    detail: 17 March 2026
    language: Portuguese
    theme: housing
    summary: Discusses why equal VAT incentives do not capture the value of housing cooperatives, arguing for community participation, access to public land, and stable public–cooperative agreements.
    quote: A mais-valia das cooperativas está na participação e na construção de comunidade.
    citation: "Viana, Marta Maçães. “IVA a 6% para todos: e as cooperativas, onde ficam?” PUBLICO, Opinião, 17 March 2026. Portuguese."
    pdf: /assets/research/papers/publico-2026-housing-cooperatives.pdf
    url: https://www.publico.pt/2026/03/17/opiniao/opiniao/iva-6-cooperativas-onde-ficam-2167952
    url_label: Read at PUBLICO
  - id: publico-anniversary-cooperatives
