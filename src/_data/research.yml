    title: Contra o “pessimismo” e o “engano”, as cooperativas renascem e resistem
    title_lang: pt
    authors: Rafaela Burd Relvas (text) · Nuno Ferreira Santos (photography)
    contribution: Expert commentary by Marta Maçães Viana
    venue: PUBLICO · 36th anniversary · A Minha Casa
    detail: 5 March 2026 · Edition directed by Eduardo Souto de Moura
    language: Portuguese
    theme: housing
    summary: A report on the renewal of housing cooperatives in Portugal and the challenges of financing, access to land and public support. Marta Maçães Viana contributes research insights on the cooperatives that remain active and the potential of European policy to support the sector.
    citation: "Relvas, Rafaela Burd. “Contra o ‘pessimismo’ e o ‘engano’, as cooperativas renascem e resistem.” PUBLICO, 36th anniversary, A Minha Casa, 5 March 2026. Photography by Nuno Ferreira Santos; expert commentary by Marta Maçães Viana."
